name: Social Posting Pipeline

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without publishing"
        required: false
        default: true
        type: boolean
      platform:
        description: "Publishing adapter platform"
        required: false
        default: "buffer"
        type: choice
        options:
          - buffer
      prompt_key:
        description: "Prompt template key from config/prompts.json"
        required: false
        default: "daily-default"
        type: string
      topic:
        description: "Optional topic override"
        required: false
        default: ""
        type: string
      post_text:
        description: "Optional final caption. Overrides generated post text."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || (inputs.dry_run && 'true' || 'false') }}
      PLATFORM: ${{ inputs.platform || 'buffer' }}
      PROMPT_KEY: ${{ inputs.prompt_key || 'daily-default' }}
      TOPIC: ${{ inputs.topic || '' }}
      POST_TEXT: ${{ inputs.post_text || '' }}
      POST_ORDER: ${{ inputs.topic || 'Create a short wellness post.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Buffer CLI
        run: npm install --global @bufferapp/cli

      - name: Install image generator dependencies
        if: env.DRY_RUN != 'true'
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Generate image
        if: env.DRY_RUN != 'true'
        run: python scripts/imagenes_generator.py > image-output.json

      - name: Publish generated image
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          image_path="$(python -c "import json; print(json.load(open('image-output.json'))['image_path'])")"
          image_path="${image_path#$GITHUB_WORKSPACE/}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$image_path"
          git commit -m "chore: add generated social image"
          git push origin "HEAD:${{ github.ref_name }}"

          image_url="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/$image_path"
          IMAGE_URL="$image_url" python -c "import json, os; image = json.load(open('image-output.json')); json.dump({'channelId': os.environ['BUFFER_CHANNEL_ID'], 'schedulingType': 'automatic', 'mode': 'addToQueue', 'text': image['post_text'], 'assets': [{'image': {'url': os.environ['IMAGE_URL'], 'metadata': {'altText': 'Wellness illustration for: ' + image['post_text']}}]}, open('buffer-post.json', 'w'))"
          buffer posts create --input buffer-post.json

      - name: Run text-only dry run
        if: env.DRY_RUN == 'true'
        run: node scripts/social-pipeline.js
