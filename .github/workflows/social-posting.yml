name: Social Posting Pipeline

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without publishing"
        required: false
        default: true
        type: boolean
      platform:
        description: "Publishing adapter platform"
        required: false
        default: "buffer"
        type: choice
        options:
          - buffer
      prompt_key:
        description: "Prompt template key from config/prompts.json"
        required: false
        default: "daily-default"
        type: string
      topic:
        description: "Optional topic override"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || (inputs.dry_run && 'true' || 'false') }}
      PLATFORM: ${{ inputs.platform || 'buffer' }}
      PROMPT_KEY: ${{ inputs.prompt_key || 'daily-default' }}
      TOPIC: ${{ inputs.topic || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Buffer CLI
        run: npm install --global @bufferapp/cli

      - name: Run pipeline
        run: node scripts/social-pipeline.js
